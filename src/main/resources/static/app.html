<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker — App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">🔥</div>
        <span>HabitTracker</span>
    </div>

    <nav class="sidebar-nav">
        <button class="nav-btn active" data-view="habits" onclick="switchView('habits')">
            <span class="nav-icon">◈</span> Habits
        </button>
        <button class="nav-btn" data-view="logs" onclick="switchView('logs')">
            <span class="nav-icon">◫</span> Logs
        </button>
    </nav>

    <div class="sidebar-footer">
        <a href="/index.html" class="back-link">← Back to home</a>
    </div>
</aside>

<!-- Main content -->
<main class="main">

    <!-- ═══════════════ HABITS VIEW ═══════════════ -->
    <div id="view-habits" class="view active">
        <div class="view-header">
            <div>
                <h1 class="view-title">My Habits</h1>
                <p class="view-sub">Track what matters. Build what lasts.</p>
            </div>
            <button class="btn-add" onclick="openModal()">+ New habit</button>
        </div>

        <!-- Toast -->
        <div id="toast" class="toast"></div>

        <!-- Habit list -->
        <div id="habit-list" class="habit-list">
            <div class="loading-state">
                <div class="spinner"></div>
                <span>Loading habits…</span>
            </div>
        </div>
    </div>

    <!-- ═══════════════ LOGS VIEW ═══════════════ -->
    <div id="view-logs" class="view">
        <div class="view-header">
            <div>
                <h1 class="view-title">Habit Logs</h1>
                <p class="view-sub">Review your history over any date range.</p>
            </div>
        </div>

        <div class="logs-controls">
            <div class="logs-select-wrap">
                <label>Habit</label>
                <select id="log-habit-select" onchange="loadLogs()">
                    <option value="">— select a habit —</option>
                </select>
            </div>
            <div class="logs-date-wrap">
                <label>From</label>
                <input type="date" id="log-from" onchange="loadLogs()" />
            </div>
            <div class="logs-date-wrap">
                <label>To</label>
                <input type="date" id="log-to" onchange="loadLogs()" />
            </div>
        </div>

        <div id="log-list" class="log-list">
            <div class="empty-state">Select a habit and date range to view logs.</div>
        </div>
    </div>
</main>

<!-- ═══════════════ CREATE / EDIT MODAL ═══════════════ -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h2 id="modal-title">New habit</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <label class="field-label">Title <span class="req">*</span></label>
            <input id="habit-title" class="field-input" type="text" placeholder="e.g. Morning run" maxlength="50" />
            <div class="field-hint">Max 50 characters</div>

            <label class="field-label" style="margin-top:1.25rem">Description</label>
            <textarea id="habit-desc" class="field-input field-textarea" placeholder="Optional details…" maxlength="255"></textarea>
            <div class="field-hint">Max 255 characters</div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" id="modal-save-btn" onclick="saveHabit()">Save</button>
        </div>
    </div>
</div>

<!-- ═══════════════ LOG MODAL ═══════════════ -->
<div id="log-modal-overlay" class="modal-overlay" onclick="closeLogModal(event)">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h2>Log completion</h2>
            <button class="modal-close" onclick="closeLogModal()">✕</button>
        </div>
        <div class="modal-body">
            <p id="log-habit-name" class="log-modal-habit-name"></p>

            <label class="field-label" style="margin-top:1rem">Date <span class="req">*</span></label>
            <input id="log-date" class="field-input" type="date" />

            <label class="field-label" style="margin-top:1.25rem">Status</label>
            <div class="toggle-row">
                <span>Completed</span>
                <label class="toggle">
                    <input type="checkbox" id="log-completed" checked />
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeLogModal()">Cancel</button>
            <button class="btn-save" onclick="saveLog()">Save log</button>
        </div>
    </div>
</div>

<script>
    // ─── State ───────────────────────────────────────────
    const API = '';   // same origin; Spring Boot serves on port 8080 by default
    let habits = [];
    let editingId = null;
    let loggingHabitId = null;

    // ─── Init ─────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      setDefaultDates();
      fetchHabits();
    });

    function setDefaultDates() {
      const today = new Date().toISOString().split('T')[0];
      const monthAgo = new Date(Date.now() - 30 * 864e5).toISOString().split('T')[0];
      document.getElementById('log-from').value = monthAgo;
      document.getElementById('log-to').value = today;
      document.getElementById('log-date').value = today;
    }

    // ─── View switching ───────────────────────────────────
    function switchView(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + view).classList.add('active');
      document.querySelector(`[data-view="${view}"]`).classList.add('active');

      if (view === 'logs') populateLogSelect();
    }

    // ─── Toast ────────────────────────────────────────────
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ─── Fetch habits ─────────────────────────────────────
    async function fetchHabits() {
      try {
        const res = await fetch(`${API}/habits`);
        if (!res.ok) throw new Error('Failed to load habits');
        habits = await res.json();
        renderHabits();
      } catch (e) {
        document.getElementById('habit-list').innerHTML =
          `<div class="error-state">⚠ Could not reach the API.<br><small>${e.message}</small></div>`;
      }
    }

    // ─── Render habits ────────────────────────────────────
    function renderHabits() {
      const list = document.getElementById('habit-list');
      if (!habits.length) {
        list.innerHTML = `<div class="empty-state">No habits yet. Create your first one!</div>`;
        return;
      }

      list.innerHTML = habits.map(h => `
        <div class="habit-card" id="habit-${h.id}">
          <div class="habit-main">
            <div class="habit-indicator"></div>
            <div class="habit-text">
              <div class="habit-title">${escHtml(h.title)}</div>
              ${h.description ? `<div class="habit-desc">${escHtml(h.description)}</div>` : ''}
              <div class="habit-meta">Created ${formatDate(h.createdAt)}</div>
            </div>
          </div>
          <div class="habit-actions">
            <button class="action-btn log-btn" onclick="openLogModal(${h.id}, '${escHtml(h.title)}')" title="Log today">
              ✓ Log
            </button>
            <button class="action-btn edit-btn" onclick="openModal(${h.id})" title="Edit">
              ✎
            </button>
            <button class="action-btn delete-btn" onclick="deleteHabit(${h.id})" title="Delete">
              ✕
            </button>
          </div>
        </div>
      `).join('');
    }

    // ─── Create / Edit modal ──────────────────────────────
    function openModal(id = null) {
      editingId = id;
      const modal = document.getElementById('modal-overlay');
      document.getElementById('modal-title').textContent = id ? 'Edit habit' : 'New habit';
      document.getElementById('modal-save-btn').textContent = id ? 'Update' : 'Save';

      if (id) {
        const h = habits.find(x => x.id === id);
        document.getElementById('habit-title').value = h.title;
        document.getElementById('habit-desc').value = h.description || '';
      } else {
        document.getElementById('habit-title').value = '';
        document.getElementById('habit-desc').value = '';
      }

      modal.classList.add('open');
      setTimeout(() => document.getElementById('habit-title').focus(), 50);
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modal-overlay')) return;
      document.getElementById('modal-overlay').classList.remove('open');
      editingId = null;
    }

    async function saveHabit() {
      const title = document.getElementById('habit-title').value.trim();
      const description = document.getElementById('habit-desc').value.trim();

      if (!title) {
        document.getElementById('habit-title').classList.add('field-error');
        return;
      }
      document.getElementById('habit-title').classList.remove('field-error');

      const body = { title, description };
      const url = editingId ? `${API}/habits/${editingId}` : `${API}/habits`;
      const method = editingId ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Request failed');
        }
        document.getElementById('modal-overlay').classList.remove('open');
        showToast(editingId ? 'Habit updated!' : 'Habit created!');
        await fetchHabits();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    // ─── Delete ───────────────────────────────────────────
    async function deleteHabit(id) {
      if (!confirm('Soft-delete this habit? It will be deactivated.')) return;
      try {
        const res = await fetch(`${API}/habits/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Delete failed');
        showToast('Habit removed.');
        await fetchHabits();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    // ─── Log modal ────────────────────────────────────────
    function openLogModal(id, name) {
      loggingHabitId = id;
      document.getElementById('log-habit-name').textContent = name;
      document.getElementById('log-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('log-completed').checked = true;
      document.getElementById('log-modal-overlay').classList.add('open');
    }

    function closeLogModal(e) {
      if (e && e.target !== document.getElementById('log-modal-overlay')) return;
      document.getElementById('log-modal-overlay').classList.remove('open');
    }

    async function saveLog() {
      const date = document.getElementById('log-date').value;
      const completed = document.getElementById('log-completed').checked;

      if (!date) { showToast('Pick a date', 'error'); return; }

      try {
        const res = await fetch(`${API}/habits/${loggingHabitId}/logs`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, completed })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Log failed');
        }
        document.getElementById('log-modal-overlay').classList.remove('open');
        showToast('Log saved! ' + (completed ? '🔥' : '—'));
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    // ─── Logs view ────────────────────────────────────────
    function populateLogSelect() {
      const sel = document.getElementById('log-habit-select');
      const current = sel.value;
      sel.innerHTML = '<option value="">— select a habit —</option>' +
        habits.map(h => `<option value="${h.id}" ${h.id == current ? 'selected' : ''}>${escHtml(h.title)}</option>`).join('');
      if (current) loadLogs();
    }

    async function loadLogs() {
      const habitId = document.getElementById('log-habit-select').value;
      const from = document.getElementById('log-from').value;
      const to = document.getElementById('log-to').value;
      const list = document.getElementById('log-list');

      if (!habitId || !from || !to) {
        list.innerHTML = `<div class="empty-state">Select a habit and date range to view logs.</div>`;
        return;
      }

      list.innerHTML = `<div class="loading-state"><div class="spinner"></div><span>Loading…</span></div>`;

      try {
        const [logsRes, streakRes] = await Promise.all([
          fetch(`${API}/habits/${habitId}/logs?from=${from}&to=${to}`),
          fetch(`${API}/habits/${habitId}/logs/streak`)
        ]);
        if (!logsRes.ok) throw new Error('Failed to fetch logs');
        if (!streakRes.ok) throw new Error('Failed to fetch streak');
        const logs = await logsRes.json();
        const streak = await streakRes.json();
        renderLogs(logs, streak);
      } catch (e) {
        list.innerHTML = `<div class="error-state">⚠ ${e.message}</div>`;
      }
    }

    function renderLogs(logs, streak) {
      const list = document.getElementById('log-list');
      if (!logs.length) {
        list.innerHTML = `<div class="empty-state">No logs found for this period.</div>`;
        return;
      }

      const { currentStreak, longestStreak } = streak;

      list.innerHTML = `
        <div class="streak-bar">
          <div class="streak-bar-inner">
            <span class="streak-label">Current streak</span>
            <span class="streak-count">${currentStreak} day${currentStreak !== 1 ? 's' : ''} 🔥</span>
          </div>
          <div class="streak-bar-inner" style="text-align:right">
            <span class="streak-label">Longest streak</span>
            <span class="streak-count" style="font-size:18px;opacity:.75">🏆 ${longestStreak} day${longestStreak !== 1 ? 's' : ''}</span>
          </div>
        </div>
        <div class="log-table">
          <div class="log-table-head">
            <span>Date</span><span>Status</span>
          </div>
          ${logs.map(l => `
            <div class="log-row ${l.completed ? 'done' : 'miss'}">
              <span class="log-date">${formatDate(l.date)}</span>
              <span class="log-status">${l.completed ? '✓ Done' : '✕ Missed'}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ─── Helpers ──────────────────────────────────────────
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(d) {
      if (!d) return '—';
      const [y, m, day] = d.split('-');
      return `${day}.${m}.${y}`;
    }

    // Enter key in modal
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal();
        closeLogModal();
      }
    });
</script>
</body>
</html>
